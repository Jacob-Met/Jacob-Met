<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Jacob Scott-Metoyer — signals to understanding</title>
  <desc id="desc">A waveform becomes structured data points and a connected model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#f1f7fc"/>
      <stop offset="1" stop-color="#f8f4ff"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#078d7c"/>
      <stop offset="0.58" stop-color="#176fd1"/>
      <stop offset="1" stop-color="#7651c9"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#365372" stroke-opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="1400" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1240" cy="58" r="180" fill="#7651c9" opacity="0.06"/>
  <circle cx="1040" cy="340" r="240" fill="#078d7c" opacity="0.055"/>

  <text x="72" y="76" fill="#087b70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">COMPUTER SCIENCE · PHYSICS · BIOLOGY</text>
  <text x="72" y="155" fill="#17243a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="760">Jacob Scott-Metoyer</text>
  <text x="72" y="210" fill="#415570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="430">building the bridge from signals to understanding</text>
  <text x="72" y="282" fill="#62738a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">MEASURE  →  STRUCTURE  →  MODEL  →  INTERPRET</text>

